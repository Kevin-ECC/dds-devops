name: CI - Docker y GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Definir nombres de imagenes
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "dockerhub_name=kevinesteban/dds-practica-devops" >> "$GITHUB_OUTPUT"

      - name: Construir imagen Docker
        run: docker build -t dds-devops-demo:test .

      - name: Verificar funcionamiento
        run: |
          docker run -d --name web-test \
            -p 127.0.0.1:8080:80 \
            dds-devops-demo:test
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ | grep -q "El fascinante mundo del ajedrez" \
              && curl -fsS http://127.0.0.1:8080/styles.css | grep -q -- "--background: #111827"; then
              echo "Prueba exitosa"
              exit 0
            fi
            sleep 1
          done
          docker logs web-test
          exit 1

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # --- NUEVO: Etiquetado y Push múltiple (latest y commit SHA) ---
      - name: Etiquetar y Publicar en GHCR
        run: |
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          
          # Tag commit
          docker tag dds-devops-demo:test "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          docker push "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          
          # Tag latest
          docker tag dds-devops-demo:test "${GHCR_IMAGE}:latest"
          docker push "${GHCR_IMAGE}:latest"

      - name: Etiquetar y Publicar en Docker Hub
        run: |
          DOCKERHUB_IMAGE="kevinesteban/dds-practica-devops"
          
          # Tag commit
          docker tag dds-devops-demo:test "${DOCKERHUB_IMAGE}:${GITHUB_SHA::7}"
          docker push "${DOCKERHUB_IMAGE}:${GITHUB_SHA::7}"
          
          # Tag latest
          docker tag dds-devops-demo:test "${DOCKERHUB_IMAGE}:latest"
          docker push "${DOCKERHUB_IMAGE}:latest"
      - name: Disparar Deploy en Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
